<!DOCTYPE html>
<html>
<head>
  <style>
    body { 
      background: #121212; color: #ff80ab; 
      font-family: 'Inter', sans-serif; padding: 20px; 
    }
    h2 { border-bottom: 1px solid #333; padding-bottom: 10px; }
    .card {
      background: #1e1e1e; padding: 15px;
      border-radius: 10px; margin-bottom: 15px;
      border: 1px solid #333;
    }
    button {
      background: #ff80ab; color: #121212;
      border: none; width: 100%; padding: 10px;
      border-radius: 5px; cursor: pointer; font-weight: 800;
      margin-top: 10px;
    }
    input {
      width: 90%; background: #222; border: 1px solid #ff80ab;
      color: white; padding: 8px; border-radius: 5px;
    }
    /* Style for the list items that appear later */
    .block-item {
       .block-item {
        color: #ff80ab;
        background: #252525;
        margin: 8px 0;
        padding: 10px;
        border-radius: 8px;
        font-size: 14px;
        border-left: 3px solid #ff80ab; /* Adds a nice pink accent bar */
        display: flex;
        justify-content: space-between;
        }
    }
  </style>
</head>
<body>
  <h2>ZenFocus Mode</h2>
  
  <div class="card">
    <p style="color: #bbb; font-size: 14px;">Block distracting sites:</p>
    <input type="text" id="siteUrl" placeholder="facebook.com">
    <button id="addBlock">Block Site</button>
  </div>

  <div id="blockList"></div>

  <script src="sidepanel.js"></script>
</body>
</html>
